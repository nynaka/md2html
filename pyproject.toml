[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md2html"
version = "0.1.0"
description = "Markdown to standalone HTML converter with Mermaid, syntax highlighting, and Admonitions"
requires-python = ">=3.11"
dependencies = [
    "mistune>=3.0.0",
    "pygments>=2.17.0",
]

[project.scripts]
md2html = "md2html.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
md2html = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
