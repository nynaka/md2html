[tox]
envlist = lint, py3
isolated_build = false

[testenv]
deps = -r requirements-dev.txt
skip_install = true
pythonpath = {toxinidir}/src
commands = pytest tests/ --cov=src/md2html --cov-report=term-missing --cov-report=xml {posargs}

[testenv:lint]
deps =
    flake8>=7.0.0
    ruff>=0.4.0
skip_install = true
pythonpath = {toxinidir}/src
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/
    flake8 src/ tests/
